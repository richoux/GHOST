name: Tests

on:
  push:
    branches-ignore:
      - 'feature/*'
  pull_request:
    branches-ignore:
      - 'feature/*'

env:
  # Customize the CMake build type here (Release, Debug, RelWithDebInfo, etc.)
  BUILD_TYPE: Release
  CXX: g++-14
  EXPERIMENTAL: ""

jobs:
  build:
    # The CMake configure and build commands are platform agnostic and should work equally
    # well on Windows or Mac.  You can convert this to a matrix build if you need
    # cross-platform coverage.
    # See: https://docs.github.com/en/actions/configuring-and-managing-workflows/configuring-a-workflow#configuring-a-build-matrix
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Create Build Environment
      # Some projects don't allow in-source building, so create a separate build directory
      # We'll use this as our working directory for all subsequent commands
      run: cmake -E make_directory ${{runner.workspace}}/GHOST/build

    - name: Configure CMake
      # Use a bash shell so we can use the same syntax for environment variable
      # access regardless of the host operating system
      shell: bash
      working-directory: ${{runner.workspace}}/GHOST/build
      # Note the current convention is to use the -S and -B options here to specify source 
      # and build directories, but this is only available with CMake 3.13 and higher.  
      # The CMake binaries on the Github Actions machines are (as of this writing) 3.12
      run: cmake -DCMAKE_BUILD_TYPE=$BUILD_TYPE -DCMAKE_CXX_COMPILER=$CXX $EXPERIMENTAL ..

    - name: Build GHOST
      working-directory: ${{runner.workspace}}/GHOST/build
      shell: bash
      run: make

    - name: Install GHOST
      working-directory: ${{runner.workspace}}/GHOST/build
      shell: bash
      run: sudo make install && sudo ldconfig

    - name: Build Tutorial Video
      working-directory: ${{runner.workspace}}/GHOST/tutorial/video
      run: mkdir -p build && cd build && cmake .. && make 

    - name: Run Tutorial Video
      working-directory: ${{runner.workspace}}/GHOST/tutorial/video/bin
      run: ./tutorial_knapsack

    - name: Clone GHOST benchmarks
      run: git clone https://github.com/richoux/GHOST-benchmarks.git

    - name: Install and run N-Queens benchmark
      working-directory: ${{runner.workspace}}/GHOST-benchmarks/n-queens
      run: make

    - uses: GuillaumeFalourd/assert-command-line-output@v2.4
		  with:
        command_line: ${{runner.workspace}}/GHOST-benchmarks/n-queens/bin/nqueens_complete 5 
        assert_file_path: nqueens_complete_5.txt
        expected_result: PASSED

    - uses: GuillaumeFalourd/assert-command-line-output@v2.4
		  with:
        command_line: ${{runner.workspace}}/GHOST-benchmarks/n-queens/bin/nqueens_seeded 5 
        assert_file_path: nqueens_seeded_5.txt
        expected_result: PASSED
